<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="700" fill="#1F2A3D"/>

  <!-- Left container: GitHub Actions -->
  <rect x="60" y="80" width="520" height="540" rx="40" ry="40" fill="none" stroke="#FF9900" stroke-width="3"/>

  <!-- Section label band (masks the top border) -->
  <rect x="170" y="60" width="300" height="40" fill="#1F2A3D"/>
  <text x="320" y="88" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700" letter-spacing="0.5">GitHub Actions</text>

  <!-- Right container: Azure Container Apps -->
  <rect x="620" y="80" width="520" height="540" rx="40" ry="40" fill="none" stroke="#FF9900" stroke-width="3"/>
  <rect x="700" y="60" width="360" height="40" fill="#1F2A3D"/>
  <text x="880" y="88" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700" letter-spacing="0.5">Azure Container Apps</text>

  <!-- ================================================================ -->
  <!-- LEFT CLUSTER ICONS (GitHub Actions: Train · Test · Build · Push) -->
  <!-- ================================================================ -->

  <!-- ICON 1 (TL @ 200, 235): TRAIN — gear -->
  <g transform="translate(200, 215)" fill="#FFFFFF">
    <g>
      <!-- 8 teeth -->
      <rect x="-6" y="-44" width="12" height="16" rx="2"/>
      <rect x="-6" y="28" width="12" height="16" rx="2"/>
      <rect x="-44" y="-6" width="16" height="12" rx="2"/>
      <rect x="28" y="-6" width="16" height="12" rx="2"/>
      <g transform="rotate(45)">
        <rect x="-6" y="-44" width="12" height="16" rx="2"/>
        <rect x="-6" y="28" width="12" height="16" rx="2"/>
        <rect x="-44" y="-6" width="16" height="12" rx="2"/>
        <rect x="28" y="-6" width="16" height="12" rx="2"/>
      </g>
    </g>
    <circle r="28" fill="#FFFFFF"/>
    <circle r="10" fill="#1F2A3D"/>
  </g>
  <text x="200" y="305" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">Train</text>

  <!-- ICON 2 (TR @ 440, 235): TEST — checklist clipboard -->
  <g transform="translate(440, 215)" fill="#FFFFFF">
    <!-- clipboard body -->
    <rect x="-30" y="-40" width="60" height="80" rx="6" fill="#FFFFFF"/>
    <!-- clip on top -->
    <rect x="-14" y="-48" width="28" height="14" rx="3" fill="#FFFFFF"/>
    <!-- inner dark area -->
    <rect x="-24" y="-32" width="48" height="68" rx="3" fill="#1F2A3D"/>
    <!-- 3 lines + 3 checks -->
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none">
      <!-- line 1 + check -->
      <path d="M -14 -16 L -8 -10 L 4 -22"/>
      <line x1="10" y1="-16" x2="20" y2="-16"/>
      <!-- line 2 + check -->
      <path d="M -14 4 L -8 10 L 4 -2"/>
      <line x1="10" y1="4" x2="20" y2="4"/>
      <!-- line 3 + check -->
      <path d="M -14 24 L -8 30 L 4 18"/>
      <line x1="10" y1="24" x2="20" y2="24"/>
    </g>
  </g>
  <text x="440" y="305" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">Test</text>

  <!-- ICON 3 (BL @ 200, 465): BUILD — Docker-ish stacked containers -->
  <g transform="translate(200, 445)" fill="#FFFFFF">
    <!-- base layer -->
    <rect x="-44" y="20" width="88" height="14" rx="2"/>
    <!-- middle row: 4 containers -->
    <rect x="-44" y="2" width="20" height="14" rx="2"/>
    <rect x="-20" y="2" width="20" height="14" rx="2"/>
    <rect x="4" y="2" width="20" height="14" rx="2"/>
    <rect x="28" y="2" width="20" height="14" rx="2"/>
    <!-- top row: 3 -->
    <rect x="-32" y="-16" width="20" height="14" rx="2"/>
    <rect x="-8" y="-16" width="20" height="14" rx="2"/>
    <rect x="16" y="-16" width="20" height="14" rx="2"/>
    <!-- whale fin -->
    <path d="M 36 -34 Q 44 -26 36 -18" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="200" y="535" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">Build</text>

  <!-- ICON 4 (BR @ 440, 465): PUSH — cloud + up arrow -->
  <g transform="translate(440, 445)" fill="#FFFFFF">
    <!-- cloud silhouette -->
    <path d="M -40 12
             Q -52 12 -52 -2
             Q -52 -16 -38 -18
             Q -34 -32 -16 -32
             Q -2 -34 4 -22
             Q 18 -28 28 -16
             Q 44 -14 44 0
             Q 44 14 30 14
             Z" fill="#FFFFFF"/>
    <!-- up arrow inside cloud (cut by darker fill) -->
    <path d="M -6 -12 L 0 -22 L 6 -12 L 3 -12 L 3 4 L -3 4 L -3 -12 Z" fill="#1F2A3D"/>
    <!-- arrow shaft to GHCR — small box below -->
    <rect x="-22" y="22" width="44" height="14" rx="3" fill="#FFFFFF"/>
    <text x="0" y="33" text-anchor="middle" fill="#1F2A3D" font-size="10" font-weight="700">GHCR</text>
  </g>
  <text x="440" y="535" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">Push</text>

  <!-- ================================================================ -->
  <!-- RIGHT CLUSTER ICONS (Azure Container Apps: FastAPI · Scale-to-0 · OIDC · /health) -->
  <!-- ================================================================ -->

  <!-- ICON 5 (TL @ 760, 235): FastAPI — lightning bolt -->
  <g transform="translate(760, 215)" fill="#FFFFFF">
    <polygon points="6,-44 -16,4 -2,4 -8,44 18,-8 4,-8 12,-44"/>
  </g>
  <text x="760" y="305" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">FastAPI</text>

  <!-- ICON 6 (TR @ 1000, 235): Scale to zero — descending bars + zero -->
  <g transform="translate(1000, 215)" fill="#FFFFFF">
    <!-- axis -->
    <line x1="-44" y1="32" x2="40" y2="32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <!-- descending bars -->
    <rect x="-40" y="-30" width="14" height="60" rx="2"/>
    <rect x="-20" y="-10" width="14" height="40" rx="2"/>
    <rect x="0" y="10" width="14" height="20" rx="2"/>
    <!-- zero on the end -->
    <circle cx="30" cy="22" r="10" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <text x="1000" y="305" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">Scale to zero</text>

  <!-- ICON 7 (BL @ 760, 465): OIDC — key -->
  <g transform="translate(760, 445)" fill="#FFFFFF">
    <!-- bow (round head with hole) -->
    <circle cx="-22" cy="0" r="22" fill="#FFFFFF"/>
    <circle cx="-22" cy="0" r="9" fill="#1F2A3D"/>
    <!-- shaft -->
    <rect x="-4" y="-5" width="48" height="10" rx="2"/>
    <!-- teeth -->
    <rect x="28" y="5" width="6" height="12" rx="1"/>
    <rect x="40" y="5" width="6" height="12" rx="1"/>
  </g>
  <text x="760" y="535" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">OIDC</text>

  <!-- ICON 8 (BR @ 1000, 465): /health — heart with ECG line -->
  <g transform="translate(1000, 445)" fill="#FFFFFF">
    <!-- heart -->
    <path d="M 0 28
             C -28 8 -42 -8 -28 -22
             C -14 -34 -2 -22 0 -10
             C 2 -22 14 -34 28 -22
             C 42 -8 28 8 0 28 Z" fill="#FFFFFF"/>
    <!-- ECG line cut through (dark) -->
    <path d="M -28 -2 L -16 -2 L -10 -14 L -2 8 L 6 -10 L 14 -2 L 28 -2"
          stroke="#1F2A3D" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1000" y="535" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">/health</text>

  <!-- ================================================================ -->
  <!-- Title strip -->
  <!-- ================================================================ -->
  <text x="600" y="660" text-anchor="middle" fill="#FFFFFF" opacity="0.65" font-size="16" font-weight="500">From Notebook to Endpoint · Forest Cover</text>
</svg>
